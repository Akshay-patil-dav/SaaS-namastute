<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF902F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF5F1F;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="5" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>
  <!-- Background Square -->
  <rect x="56" y="56" width="400" height="400" rx="80" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Letter N -->
  <path d="M190 330V182L322 330V182" stroke="white" stroke-width="45" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  
  <!-- Smile Curve -->
  <path d="M150 370C180 430 332 430 362 370" stroke="white" stroke-width="22" stroke-linecap="round" fill="none" filter="url(#shadow)"/>
  
  <!-- Gloss -->
  <path d="M120 100H392C410 100 420 110 420 128V180C300 160 200 200 92 180V128C92 110 102 100 120 100Z" fill="white" fill-opacity="0.1" />
</svg>
