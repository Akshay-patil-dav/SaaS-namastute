  datasource:
    url: jdbc:postgresql://dpg-d88p9cek1jcs73fpc33g-a.oregon-postgres.render.com:5432/namustutam_db?sslmode=require
    username: namustutam_db_user
    password: V1EyJzIg7Ca4vzf2X12tc8Oszb1eifxR
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
            scope: email, profile
          facebook:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FACEBOOK_CLIENT_ID:YOUR_FACEBOOK_CLIENT_ID}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FACEBOOK_CLIENT_SECRET:YOUR_FACEBOOK_CLIENT_SECRET}
            scope: email, public_profile

  # ── File Upload Size Limits ──────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB      # max size per individual file
      max-request-size: 50MB   # max total size for all files in one request

server:
  port: 3000

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Optional comma-separated extra CORS origins (e.g. for dev ports, ngrok, staging)
  cors-extra-origins: ${CORS_EXTRA_ORIGINS:}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

